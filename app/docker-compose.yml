services:
  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    network_mode: "host"
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    network_mode: "host"
    volumes:
      - /app/node_modules
      - ./client:/app
    depends_on:
      - cms
  web-app:
    build:
      context: ./server/ArgoCD/ArgoCD-Web-App
      dockerfile: Dockerfile
    network_mode: "host"
    restart: always
    volumes:
      - ./server/ArgoCD/ArgoCD-Web-App:/app
    depends_on:
      - mongo
  cronjob:
    build:
      context: ./server/ArgoCD/ArgoCD-Monitor-Cronjob
      dockerfile: Dockerfile
    restart: always
    network_mode: "host"
    depends_on:
      - mongo
      - redis
  notification:
    build:
      context: ./server/ArgoCD/Notifications
      dockerfile: Dockerfile
    restart: always
    network_mode: "host"
    depends_on:
      - mongo
      - nats
  slack:
    build:
      context: ./server/ArgoCD/Slack
      dockerfile: Dockerfile
    restart: always
    network_mode: "host"
    depends_on:
      - mongo
      - nats
  email:
    build:
      context: ./server/ArgoCD/Email
      dockerfile: Dockerfile
    restart: always
    network_mode: "host"
    depends_on:
      - mongo
      - nats
  github-sync:
    build:
      context: ./server/GitHub/GitHub-Sync-Service
      dockerfile: Dockerfile
    restart: always
    network_mode: "host"
    environment:
      - MONGO_URL=mongodb://mongouser:mongopassword@localhost:27017/admin
    depends_on:
      - mongo

  # github-monitor is DISABLED — redundant with github-sync which has rate limit optimizations
  # github-monitor:
  #   build:
  #     context: ./server/GitHub/GitHub-Monitor-Service
  #     dockerfile: Dockerfile
  #   restart: always
  #   network_mode: "host"
  #   depends_on:
  #     - mongo
  mongo: # mongosh --username mongouser --password mongopassword
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongouser
      MONGO_INITDB_ROOT_PASSWORD: mongopassword
    volumes:
      - mongo_test:/data/db
    restart: always
    network_mode: "host" # Use the host network mode

  redis:
    image: "redis:7.2.3-alpine"
    restart: always
    network_mode: "host" # Use the host network mode

  nats:
    image: nats:latest
    restart: always
    network_mode: "host" # Use the host network mode

volumes:
  mongo_test:
